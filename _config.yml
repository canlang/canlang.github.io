# Site settings
title: "Sangjae Lee | Academic CV & Research Portfolio"
description: "Staff Engineer at Samsung Research with Ph.D. from KAIST. Research focused on indoor localization, wireless sensing, sensor fusion, and AI-driven spatial intelligence."
url: "https://research.studiosjlee.com"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
