# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "+82-10-8960-0708"
resume_contact_address:         "291, Daehak-ro, Yuseong-gu, Daejeon, Republic of Korea"

resume_header_contact_info:     "Daejeon, Republic of Korea • +82-10-8960-0708 • summit@kaist.ac.kr"
