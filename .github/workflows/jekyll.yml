name: Modern CV Deploy
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modern-cv/package-lock.json

      - name: Install dependencies
        working-directory: modern-cv
        run: npm ci

      - name: Build modern CV site
        working-directory: modern-cv
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./modern-cv/dist
