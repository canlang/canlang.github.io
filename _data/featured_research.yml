# Featured Research & Systems
- id: geomagnetic-localization
  title: "Augmented 3D Geomagnetic Indoor Positioning"
  badge: "Ph.D. Dissertation • IEEE Access '20"
  summary: "Infrastructure-free indoor positioning leveraging ambient geomagnetic anomalies. Formulates augmented gradient vectors and sequence matching to achieve orientation-invariant sub-meter positioning without external beacon deployment."
  key_points:
    - "Eliminates magnetic heading sensitivity through multi-axis augmented vector modeling."
    - "Maintains meter-level accuracy in complex reinforced concrete structures without anchor installation."
  links:
    - label: "Paper (IEEE Access)"
      url: "https://ieeexplore.ieee.org/document/9216148"
    - label: "Dissertation"
      url: "#education"

- id: robot-slam-radiomap
  title: "Autonomous Mobile Robot SLAM & Radio Map Construction"
  badge: "MDPI Sensors '20 • ACM MobiSys '19"
  summary: "Autonomous robotic survey systems ('Rover') fusing LiDAR/inertial SLAM with Wi-Fi positioning. Automatically constructs dense indoor radio maps with centimeter-grade odometry, replacing manual fingerprinting site surveys."
  key_points:
    - "Pose-graph optimization coupling Wi-Fi signal decay with mobile robot odometry and loop-closure."
    - "Demonstrated autonomous radio map construction at ACM MobiSys '19 in Seoul."
  links:
    - label: "Paper (MDPI Sensors)"
      url: "https://www.mdpi.com/1424-8220/20/18/5182"
    - label: "MobiSys '19"
      url: "https://dl.acm.org/doi/abs/10.1145/3307334.3328596"

- id: kailos-platform
  title: "KAILOS: Global Crowdsourced Indoor Positioning Platform"
  badge: "Platform • Pervasive & Mobile Computing '16"
  summary: "Pioneered crowdsourced indoor positioning and navigation systems. Built cloud-native log ingestion pipelines, floor-plan registration tools, and client positioning SDKs serving real-world users."
  key_points:
